<!-- ================= VENDOR MODAL ================= -->
<div
    class="modal fade"
    id="vendorModal"
    tabindex="-1"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered modal-lg">

        <div class="modal-content vendor-modal">

            <!-- HEADER -->
            <div class="modal-header vendor-modal-header">

                <div>
                    <span class="modal-eyebrow">
                        PARTNER WITH US
                    </span>

                    <h5 class="modal-title">
                        Add New Vendor
                    </h5>

                    <p class="vendor-subtitle">
                        Tell us about your food business
                    </p>
                </div>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                ></button>

            </div>


            <!-- BODY -->
            <div class="modal-body">

                <form id="vendorForm">

                    <!-- Vendor Name -->
                    <div class="vendor-field">

                        <label>
                            <i class="bi bi-shop"></i>
                            Vendor Name
                        </label>

                        <input
                            type="text"
                            id="vendorName"
                            placeholder="e.g. Karachi Biryani"
                            required
                        >

                    </div>


                    <!-- Food Type -->
                    <div class="vendor-field">

                        <label>
                            <i class="bi bi-grid"></i>
                            Food Type
                        </label>

                        <select
                            id="vendorType"
                            required
                        >

                            <option value="">
                                Select food type
                            </option>

                            <option value="Burgers & Fast Food">
                                Burgers & Fast Food
                            </option>

                            <option value="Pizza">
                                Pizza
                            </option>

                            <option value="Chicken">
                                Chicken
                            </option>

                            <option value="Desi Food">
                                Desi Food
                            </option>

                            <option value="Desserts">
                                Desserts
                            </option>

                            <option value="Drinks">
                                Drinks
                            </option>

                        </select>

                    </div>


                    <!-- Phone -->
                    <div class="vendor-field">

                        <label>
                            <i class="bi bi-telephone"></i>
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="vendorPhone"
                            placeholder="03001234567"
                            required
                        >

                    </div>


                    <!-- Address -->
                    <div class="vendor-field">

                        <label>
                            <i class="bi bi-geo-alt"></i>
                            Address
                        </label>

                        <input
                            type="text"
                            id="vendorAddress"
                            placeholder="e.g. Main Tariq Road, Karachi"
                            required
                        >

                    </div>


                    <!-- Vendor Bio -->
                    <div class="vendor-field">

                        <label>
                            <i class="bi bi-person-lines-fill"></i>
                            Vendor Bio
                        </label>

                        <textarea
                            id="vendorBio"
                            rows="4"
                            placeholder="Tell customers about your restaurant, special dishes and experience..."
                            required
                        ></textarea>

                    </div>


                    <!-- Error -->
                    <div
                        id="vendor-error"
                        class="vendor-error"
                    ></div>


                    <!-- Button -->
                    <button
                        type="submit"
                        class="vendor-submit-btn"
                    >

                        <i class="bi bi-plus-circle"></i>

                        Add Vendor

                    </button>

                </form>

            </div>

        </div>

    </div>
</div>
